plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'dev.isira.jaspring' version '0.4.0'
}

group = 'dev.isira.jaspring'
version = '0.0.1-SNAPSHOT'
description = 'jaspring-docs'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'dev.isira:jaspring-spring-boot-starter:0.4.0'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // Lets bootRun recompile src/main/typescript when an IDE run skipped Gradle; not packaged.
    developmentOnly 'dev.isira:jaspring-typescript:0.4.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.named('bootJar') {
    archiveFileName = 'jaspring-docs.jar'
}
